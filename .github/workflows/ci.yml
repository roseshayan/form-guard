name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run test suite
        run: composer test

  static-analysis:
    name: Static analysis, style and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Run PHPStan
        run: composer analyse

      - name: Check code style
        run: composer lint

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate coverage
        run: composer coverage

      - name: Enforce coverage floor
        run: composer coverage:check

  backward-compatibility:
    name: Backward compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo, dom, simplexml
          coverage: none
          tools: composer:v2

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install BC checker in isolated Composer home
        run: composer global require --no-interaction --no-progress roave/backward-compatibility-check:^8.21

      - name: Check public API for BC breaks
        shell: bash
        run: |
          BC_BIN="$(composer global config bin-dir --absolute)/roave-backward-compatibility-check"
          "$BC_BIN" --format=github-actions
